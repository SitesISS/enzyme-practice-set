    "q": "Which of these is a prosthetic group?",
    "o": [
     "The haem group in catalase",
     "Glucose bound to amylase",
     "An amino acid in the chain",
     "A water molecule in the site"
    ],
    "a": 0,
    "x": "Haem is permanently bound and needed for catalase to work."
   }
  ]
 },
 {
  "id": "p56",
  "topic": "Enzyme basics",
  "q": "Zinc ions that bind to enzymes and are needed for their activity are called",
  "o": [
   "substrates",
   "cofactors",
   "products",
   "inhibitors"
  ],
  "a": 1,
  "w": {
   "0": "The enzyme doesn't convert zinc, so zinc isn't a substrate.",
   "2": "Zinc isn't produced by the reaction.",
   "3": "Zinc is needed for activity, so it isn't an inhibitor."
  },
  "x": "Cofactors are non-protein substances an enzyme needs in order to work. Inorganic ions such as Zn²⁺, Mg²⁺ and Cl⁻ (for amylase) are common examples.",
  "s": [
   {
    "q": "Salivary amylase works much better when chloride ions are present. The chloride ions are acting as",
    "o": [
     "a cofactor",
     "a substrate",
     "a competitive inhibitor",
     "a product"
    ],
    "a": 0,
    "x": "Cl⁻ helps amylase's active site take the right shape."
   }
  ]
 },
 {
  "id": "p57",
  "topic": "Regulation",
  "q": "Reactions in cells are organised into _______, in which the product of one reaction is the substrate of the next.",
  "o": [
   "metabolic pathways",
   "induced fits",
   "allosteric sites",
   "active sites"
  ],
  "a": 0,
  "w": {
   "1": "Induced fit describes a shape change in a single enzyme.",
   "2": "Allosteric sites are regulatory sites on an enzyme.",
   "3": "An active site is part of a single enzyme."
  },
  "x": "In a pathway such as A → B → C → D, each step has its own enzyme. Controlling one key enzyme can regulate the whole pathway.",
  "s": [
   {
    "q": "In the pathway A → B → C, what is B?",
    "o": [
     "Only a product of step 1",
     "A product and a substrate",
     "An enzyme for step 2",
     "An inhibitor of step 1"
    ],
    "a": 1,
    "x": "Intermediates like B link one step to the next."
   }
  ]
 },
 {
  "id": "p58",
  "topic": "Temperature and pH",
  "q": "Pepsin works in the strongly acidic stomach. At that pH, what form will most carboxyl groups in its R groups take?",
  "o": [
   "–COO⁻",
   "–COOH",
   "–NH₃⁺",
   "–OH"
  ],
  "a": 1,
  "w": {
   "0": "–COO⁻ forms when H⁺ is removed. That happens at neutral or high pH, not in strong acid.",
   "2": "That is an amino group, not a carboxyl group.",
   "3": "That is a hydroxyl group, not a carboxyl group."
  },
  "x": "In strong acid the H⁺ concentration is high, so carboxyl groups keep their H⁺ (–COOH, uncharged). Pepsin's active site is adapted to work in this form, while most other enzymes stop working at pH 2.",
  "s": [
   {
    "q": "What does a high concentration of H⁺ ions do to a –COO⁻ group?",
    "o": [
     "It removes more H⁺",
     "It adds H⁺, giving –COOH",
     "It turns it into an –NH₂ group",
     "It has no effect"
    ],
    "a": 1,
    "x": "With lots of H⁺ around, –COO⁻ picks one up."
   }
  ]
 },
 {
  "id": "p59",
  "topic": "Activation energy",
  "q": "Which of these is NOT a way that enzymes help reactions happen?",
  "o": [
   "Holding substrates close together in the right orientation",
   "Putting strain on bonds in the substrate",
   "Temporarily adding chemical groups to the substrate",
   "Giving the substrate extra kinetic energy"
  ],
  "a": 3,
  "w": {
   "0": "This does happen. Bringing substrates together in the right orientation makes a reaction more likely.",
   "1": "This does happen. Strained bonds break more easily.",
   "2": "This does happen. Some enzymes briefly transfer chemical groups to the substrate."
  },
  "x": "Enzymes don't add energy. They lower the activation energy by orienting, straining and chemically assisting their substrates.",
  "s": [
   {
    "q": "Do enzymes provide energy for the reactions they catalyse?",
    "o": [
     "Yes, from ATP every time",
     "No, they lower the energy needed",
     "Yes, as heat",
     "Only for energy-releasing reactions"
    ],
    "a": 1,
    "x": "Enzymes lower the barrier rather than supplying energy to climb it."
   }
  ]
 },
 {
  "id": "p60",
  "topic": "Active site and specificity",
  "q": "An enzyme converts substrate A into product B. Which molecule would be most likely to be acted on by this enzyme as well?",
  "o": [
   "One with the same overall charge as A",
   "One with the same molecular mass as A",
   "One with the same number of carbon atoms as A",
   "One with the same 3D shape and charges as A"
  ],
  "a": 3,
  "w": {
   "0": "Charge matters, but so does shape.",
   "1": "Two molecules can have the same mass but very different shapes.",
   "2": "The same number of carbon atoms can be arranged into many different shapes."
  },
  "x": "Binding needs a complementary fit in both shape and the pattern of charges. A molecule that matches A on both is the most likely to fit.",
  "s": [
   {
    "q": "Which property matters most for a molecule to fit an active site?",
    "o": [
     "Its molecular mass",
     "A complementary shape",
     "Its colour",
     "Its number of oxygen atoms"
    ],
    "a": 1,
    "x": "The active site recognises shape and charge, not mass."
   }
  ]
 }
];

const IMGS = {};
const IMGW = {"energy": 360, "hb": 640, "shapes": 300, "path1": 430, "path2": 380, "ph": 500, "sat": 440, "temp": 360};

const CONFIG = {"mode": "pool", "setSize": 15, "storageKey": "enzyme-pool-v1", "cheers": ["Correct.", "That's right.", "Yes, well done.", "Spot on."], "introTitle": "15 questions from a bank of 60", "intro": "A random set covering enzyme basics, the active site, activation energy, rates, inhibitors, temperature and pH, and regulation. You can take a new set as often as you like: questions you haven't seen come first, then the ones you found hardest."};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LET = ["A", "B", "C", "D", "E"];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => (n % 1 ? Math.floor(n) + "½" : String(n)).replace(/^0½$/, "½");
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const store = {
  read() { try { return JSON.parse(localStorage.getItem(CONFIG.storageKey) || "null") || { seen: {}, sets: 0 }; } catch (e) { return { seen: {}, sets: 0 }; } },
  write(v) { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(v)); } catch (e) {} }
};

let S = null; // session state

/* Balanced answer positions: correct answers are dealt from a shuffled deck of A-D,
   so each letter comes up equally often and never more than twice in a row. */
function deal(bagName, n, allowed) {
  const bag = S[bagName], hist = S[bagName + "Hist"] || (S[bagName + "Hist"] = []);
  const ok = t => t < n && (!allowed || allowed.includes(t)) && !(hist.length >= 2 && hist[hist.length - 1] === t && hist[hist.length - 2] === t);
  let k = -1;
  for (let tries = 0; tries < 3 && k < 0; tries++) {
    for (let j = bag.length - 1; j >= 0; j--) if (ok(bag[j])) { k = j; break; }
    if (k < 0) bag.unshift(...shuffle([0, 1, 2, 3]));
  }
  const t = k >= 0 ? bag.splice(k, 1)[0] : (allowed ? allowed[0] : Math.floor(Math.random() * n));
  hist.push(t); return t;
}
/* Build a display order putting the correct option at position t. Ordered options
   (pH values, enzyme letters) are shown ascending or descending instead of shuffled. */
function orderFor(n, correct, t, fixed) {
  const idx = [...Array(n).keys()];
  if (fixed) { const desc = idx.slice().reverse(); if (n - 1 - correct === t) return desc; if (correct === t) return idx; return Math.random() < 0.5 ? idx : desc; }
  const rest = shuffle(idx.filter(i => i !== correct));
  rest.splice(t, 0, correct); return rest;
}

function figHTML(key) {
  const f = FIGS[key]; if (!f) return "";
  if (f.html) return `<figure class="fig">${f.html}</figure>`;
  return `<figure class="fig"><img src="${IMGS[f.img]}" alt="${esc(f.alt)}" style="width:${IMGW[f.img] || 420}px">${f.cap ? `<p class="fig-cap">${esc(f.cap)}</p>` : ""}</figure>`;
}

/* ---------- Building a set ---------- */
function pickSet(onlyIds) {
  if (onlyIds) return QUESTIONS.filter(q => onlyIds.includes(q.id));
  if (CONFIG.mode === "fixed") return QUESTIONS.slice();
  const seen = store.read().seen;
  const fresh = shuffle(QUESTIONS.filter(q => !seen[q.id]));
  const rank = { miss: 0, help: 1, first: 2 };
  const old = shuffle(QUESTIONS.filter(q => seen[q.id])).sort((a, b) => rank[seen[a.id]] - rank[seen[b.id]]);
  return fresh.concat(old).slice(0, CONFIG.setSize);
}

function start(onlyIds) {
  const set = pickSet(onlyIds);
  S = { set, i: 0, results: [], points: 0, phase: "main", step: 0, first: null, order: null, retried: !!onlyIds, mainBag: [], stepBag: [] };
  if (CONFIG.mode === "pool" && !onlyIds) { const st = store.read(); st.sets = (st.sets || 0) + 1; store.write(st); }
  $("#scorebox").hidden = false; $("#strip").hidden = false;
  $("#qtot").textContent = set.length;
  renderStrip(); showQuestion();
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function renderStrip() {
  $("#strip").innerHTML = S.set.map((q, k) => `<span class="${S.results[k] || (k === S.i ? "now" : "")}"></span>`).join("");
  $("#qpos").textContent = Math.min(S.i + 1, S.set.length);
  $("#score").textContent = fmt(S.points);
}

/* ---------- Question screens ---------- */
function layout() {
  $("#app").innerHTML = `<div class="grid">
    <section class="card qcard" id="qcard" aria-live="polite"></section>
    <aside class="card tutor"><h2>Feedback</h2><div class="log" id="log" aria-live="polite"></div><div class="actions" id="actions"></div></aside>
  </div>`;
}

function showQuestion() {
  layout();
  const q = cur();
  S.phase = "main"; S.step = 0; S.first = null; S.order = orderFor(4, q.a, deal("mainBag", 4, q.fixed ? [q.a, 3 - q.a] : null), q.fixed);
  addMsg("idle", "", CONFIG.mode === "fixed" ? "Study the figure, then choose an answer. If it isn't right, you'll get feedback and one or two check-up questions before trying again." : "Choose an answer. If it isn't right, you'll get feedback and a check-up question before trying again.");
  drawCard();
}

const cur = () => S.set[S.i];

function trailHTML() {
  if (S.phase === "main") return "";
  const q = cur(), n = q.s.length, parts = [`<b class="done">Question</b>`];
  for (let k = 0; k < n; k++) parts.push(`<b class="${S.phase === "step" && S.step === k ? "on" : (S.phase === "retry" || S.step > k ? "done" : "")}">Check-up ${k + 1}</b>`);
  parts.push(`<b class="${S.phase === "retry" ? "on" : ""}">Second try</b>`);
  return `<div class="trail" aria-label="Your route through this question">${parts.join("<i>→</i>")}</div>`;
}

function drawCard() {
  const q = cur();
  let label, cls, stem, opts, order;
  if (S.phase === "step") {
    const s = q.s[S.step];
    label = `Check-up ${S.step + 1} of ${q.s.length}`; cls = "step"; stem = s.q; opts = s.o; order = S.stepOrder;
  } else {
    label = S.phase === "retry" ? `Second try · Question ${S.i + 1}` : `Question ${S.i + 1}`;
    cls = S.phase === "retry" ? "retry" : ""; stem = q.q; opts = q.o; order = S.order;
  }
  $("#qcard").innerHTML = `
    <div class="qhead"><span class="stage ${cls}">${label}</span><span class="topic">${esc(q.topic)}</span></div>
    ${trailHTML()}
    ${q.fig ? figHTML(q.fig) : ""}
    <p class="stem">${esc(stem)}</p>
    <div class="opts" id="opts">${order.map((oi, pos) => `<button class="opt" data-oi="${oi}" id="opt-${pos}"><span class="k">${LET[pos]}</span><span>${esc(opts[oi])}</span><span class="mark"></span></button>`).join("")}</div>
    <p class="keys">Tip: press A–D (or 1–4) to answer, and Enter to continue.</p>`;
  $("#opts").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.oi)));
  setActions([]);
}

function letterOf(oi) { const order = S.phase === "step" ? S.stepOrder : S.order; return LET[order.indexOf(oi)]; }
function prepStep() { const s = cur().s[S.step], n = s.o.length; S.stepOrder = orderFor(n, s.a, deal("stepBag", n, s.fixed ? [s.a, n - 1 - s.a] : null), s.fixed); }
function retryOrder(q) {
  const was = S.order.indexOf(q.a);
  if (q.fixed) { const flip = S.order.slice().reverse(); return flip.indexOf(q.a) !== was ? flip : S.order; }
  const t = shuffle([0, 1, 2, 3].filter(p => p !== was))[0];
  return orderFor(4, q.a, t, false);
}

function lockOptions(chosen, correct, revealCorrect) {
  $("#opts").querySelectorAll(".opt").forEach(b => {
    const oi = +b.dataset.oi; b.disabled = true;
    if (oi === chosen && chosen === correct) { b.classList.add("right"); b.querySelector(".mark").textContent = "Correct"; }
    else if (oi === chosen) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "Your answer"; }
    else if (oi === correct && revealCorrect) { b.classList.add("right"); b.querySelector(".mark").textContent = "Answer"; }
    else b.classList.add("dim");
  });
}

function choose(oi) {
  const q = cur();
  if (S.phase === "step") {
    const s = q.s[S.step], ok = oi === s.a;
    lockOptions(oi, s.a, true);
    addMsg(ok ? "good" : "bad", ok ? `Check-up ${S.step + 1}: correct` : `Check-up ${S.step + 1}: the answer is ${letterOf(s.a)}`, s.x);
    const last = S.step === q.s.length - 1;
    setActions([{ label: last ? "Try the question again" : `Check-up ${S.step + 2}`, go: () => { if (last) { S.phase = "retry"; const before = S.order.join(); S.order = retryOrder(q); addMsg("hint", "Second try", S.order.join() !== before ? "The options have been reordered, so read them again. Use what the check-ups showed you." : "Use what the check-ups showed you."); } else { S.step++; prepStep(); } drawCard(); focusFirst(); } }]);
    return;
  }
  const ok = oi === q.a;
  if (S.phase === "main") {
    if (ok) {
      lockOptions(oi, q.a, false); finish("first", 1);
      addMsg("good", CONFIG.cheers[Math.floor(Math.random() * CONFIG.cheers.length)], q.x);
    } else {
      S.first = oi; lockOptions(oi, q.a, false);
      addMsg("bad", `Not quite: ${letterOf(oi)} isn't right`, q.w[oi] || "That isn't the right answer.");
      const n = q.s.length;
      addMsg("hint", "Build up to it", n > 1 ? `Answer ${n} quick check-up questions on the idea behind this one, then try it again.` : "Answer one quick check-up question on the idea behind this one, then try it again.");
      setActions([{ label: "Start the check-up", go: () => { S.phase = "step"; S.step = 0; prepStep(); drawCard(); focusFirst(); } }]);
    }
    return;
  }
  // retry
  lockOptions(oi, q.a, true);
  if (ok) { finish("help", 0.5); addMsg("good", "Got it on the second try", q.x); }
  else { finish("miss", 0); addMsg("bad", `Not this time. The answer is ${letterOf(q.a)}`, (q.w[oi] ? q.w[oi] + "\n" : "") + q.x); }
}

function finish(result, pts) {
  S.results[S.i] = result; S.points += pts;
  if (CONFIG.mode === "pool") { const st = store.read(); st.seen[cur().id] = result; store.write(st); }
  renderStrip();
  const last = S.i === S.set.length - 1;
  setActions([{ label: last ? "See my results" : "Next question", go: () => { if (last) showEnd(); else { S.i++; renderStrip(); showQuestion(); scrollTopCard(); focusFirst(); } } }]);
}

function addMsg(kind, title, text) {
  const log = $("#log");
  if (kind !== "idle") log.querySelectorAll(".msg.idle").forEach(m => m.remove());
  const d = document.createElement("div");
  d.className = "msg " + kind;
  d.innerHTML = (title ? `<h3>${esc(title)}</h3>` : "") + String(text).split("\n").map(t => `<p>${esc(t)}</p>`).join("");
  log.appendChild(d);
  if (kind !== "idle" && window.innerWidth <= 860) d.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
}

function setActions(list) {
  const a = $("#actions"); a.innerHTML = "";
  list.forEach((it, k) => { const b = document.createElement("button"); b.className = "btn" + (it.ghost ? " ghost" : ""); b.textContent = it.label; b.addEventListener("click", it.go); a.appendChild(b); if (k === 0) setTimeout(() => b.focus({ preventScroll: true }), 0); });
}
function focusFirst() { const b = $("#opt-0"); if (b) b.focus({ preventScroll: true }); }
function scrollTopCard() { const c = $("#qcard"); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }); }

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  const idx = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
  if (idx >= 0 && k.length === 1) { const b = $("#opt-" + idx); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});

/* ---------- Start + end screens ---------- */
function showIntro() {
  $("#scorebox").hidden = true; $("#strip").hidden = true;
  let extra = "";
  if (CONFIG.mode === "pool") {
    const st = store.read(), seenN = Object.keys(st.seen).filter(id => QUESTIONS.some(q => q.id === id)).length, left = QUESTIONS.length - seenN;
    extra = seenN ? `<p class="note">On this device you've answered ${seenN} of the ${QUESTIONS.length} questions. ${left >= CONFIG.setSize ? `Your next set will be ${CONFIG.setSize} you haven't seen yet.` : left > 0 ? `Your next set has the ${left} you haven't seen yet, topped up with ones you found hardest.` : "Your next set will focus on the ones you found hardest."} <button class="linkbtn" id="reset">Forget my progress</button></p>`
      : `<p class="note">Each set is ${CONFIG.setSize} questions drawn from a bank of ${QUESTIONS.length}. New sets give you questions you haven't seen first.</p>`;
  }
  $("#app").innerHTML = `<div class="intro">
    <section class="card"><h2 class="sec">${esc(CONFIG.introTitle)}</h2><p>${esc(CONFIG.intro)}</p>${extra}
      <div class="actions" style="margin-top:14px"><button class="btn" id="go">${CONFIG.mode === "pool" ? "Start a set of " + Math.min(CONFIG.setSize, QUESTIONS.length) : "Start the quiz"}</button></div></section>
    <aside class="card"><h2 class="sec">How it works</h2>
      <ol class="how">
        <li><span>Answer the question. A correct first answer scores 1 mark.</span></li>
        <li><span>If you're wrong, you'll see why your answer doesn't work, then one or two check-up questions on the idea behind it.</span></li>
        <li><span>Then you get a second try at the original question. Getting it right now scores ½ mark.</span></li>
      </ol>
      <div class="marks" style="margin-top:16px">
        <span class="sw" style="background:var(--good)"></span><span>Correct first time</span>
        <span class="sw" style="background:var(--hint)"></span><span>Correct after the check-up</span>
        <span class="sw" style="background:var(--bad)"></span><span>Still not right: worth revising</span>
      </div>
    </aside></div>`;
  $("#go").addEventListener("click", () => start());
  const r = $("#reset"); if (r) r.addEventListener("click", () => { store.write({ seen: {}, sets: 0 }); showIntro(); });
}

function showEnd() {
  const n = S.set.length, c = { first: 0, help: 0, miss: 0 };
  S.results.forEach(r => c[r]++);
  const topics = {};
  S.set.forEach((q, k) => { const t = topics[q.topic] || (topics[q.topic] = { first: 0, help: 0, miss: 0 }); t[S.results[k]]++; });
  const weak = S.set.map((q, k) => ({ q, r: S.results[k] })).filter(x => x.r !== "first");
  const pct = Math.round(S.points / n * 100);
  $("#strip").innerHTML = S.set.map((q, k) => `<span class="${S.results[k]}"></span>`).join("");
  $("#qpos").textContent = n;
  let poolNote = "";
  if (CONFIG.mode === "pool") {
    const st = store.read(), left = QUESTIONS.filter(q => !st.seen[q.id]).length;
    poolNote = `<p class="note">${left ? `${left} questions in the bank are still new to you.` : "You've now seen every question in the bank. New sets will focus on the ones you found hardest."}</p>`;
  }
  $("#app").innerHTML = `<div class="grid">
    <section class="card" style="display:flex;flex-direction:column;gap:16px">
      <div class="eyebrow">Results</div>
      <div class="big">${fmt(S.points)}<small> / ${n} · ${pct}%</small></div>
      <div class="tally">
        <div class="t1"><b>${c.first}</b><span>right first time</span></div>
        <div class="t2"><b>${c.help}</b><span>right after help</span></div>
        <div class="t3"><b>${c.miss}</b><span>to revise</span></div>
      </div>
      ${poolNote}
      <div class="actions">
        ${CONFIG.mode === "pool" ? `<button class="btn" id="again">Start a new set</button>` : `<button class="btn" id="again">Start again</button>`}
        ${weak.length ? `<button class="btn ghost" id="weak">Redo the ${weak.length} I didn't get first time</button>` : ""}
      </div>
      <div><h2 class="sec">By topic</h2>
        <table class="topics"><thead><tr><th>Topic</th><th class="n">First time</th><th class="n">After help</th><th class="n">To revise</th></tr></thead>
        <tbody>${Object.entries(topics).map(([t, v]) => `<tr><td>${esc(t)}</td><td class="n">${v.first}</td><td class="n">${v.help}</td><td class="n">${v.miss}</td></tr>`).join("")}</tbody></table></div>
    </section>
    <aside class="card"><h2 class="sec">Review</h2>
      ${weak.length ? `<div class="review">${weak.map(({ q, r }) => `<details><summary><span class="tag ${r}">${r === "help" ? "After help" : "Revise"}</span><span>${esc(q.q)}</span></summary><p class="ans">Answer: ${esc(q.o[q.a])}</p><p>${esc(q.x)}</p></details>`).join("")}</div>` : `<p>You got every question right first time. Nothing to review.</p>`}
    </aside></div>`;
  $("#again").addEventListener("click", () => CONFIG.mode === "pool" ? showIntro() : start());
  const w = $("#weak"); if (w) w.addEventListener("click", () => start(weak.map(x => x.q.id)));
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

showIntro();
</script>
